x-provision-source: &provision-source
  - ./docker/mediawiki:/opt/farm:ro
  - ./docker/mediawiki:/var/www/mediawiki/docker/mediawiki:ro
  - ./mediawiki/LocalSettings.php:/var/www/mediawiki/LocalSettings.php:ro
  - ./mediawiki/S3Settings.php:/var/www/mediawiki/S3Settings.php:ro
  - ./mediawiki/extensions/CreateWiki:/var/www/mediawiki/extensions/CreateWiki:ro
  - ./docker/tests/provision-single-settings.php:/opt/provision-single-settings.php:ro
  - ./docker/tests/provision-single.php:/opt/farm/provision.php:ro
  - ./docker/tests/provisioning.php:/opt/provisioning-test.php:ro
  - ./docker/tests/checkuser-consolidate.php:/opt/consolidate-test.php:ro
  - ./docker/tests/oauth-provisioning.php:/opt/oauth-provisioning-test.php:ro
services:
  init:
    volumes: *provision-source
    environment:
      MW_JOBCHRON_TEST_ISOLATED: '1'
  provisioner:
    volumes: *provision-source
    environment:
      MW_PROVISION_SINGLE_PASS: ${MW_PROVISION_SINGLE_PASS:-0}
      MW_JOBCHRON_TEST_ISOLATED: '1'
networks:
  default:
    internal: true
